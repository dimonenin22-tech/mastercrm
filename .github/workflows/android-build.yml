name: Build JuNailCRM Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        working-directory: ./android-app
        run: gradle assembleRelease --stacktrace

      - name: Prepare JuNailCRM APK
        run: |
          find android-app/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} JuNailCRM.apk \;
          ls -la JuNailCRM.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JuNailCRM
          path: JuNailCRM.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.3.1
          name: JuNailCRM Release v2.3.1
          files: JuNailCRM.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
