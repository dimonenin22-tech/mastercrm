services:
  - type: web
    name: mastercrm-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TIMEZONE
        value: Europe/Kyiv
      - key: BOT_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mastercrm-postgres
          property: connectionString

databases:
  - name: mastercrm-postgres
    plan: free
    region: frankfurt
    databaseName: mastercrm_db
    user: mastercrm
