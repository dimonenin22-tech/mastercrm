version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mastercrm_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mastercrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mastercrm_pass}
      POSTGRES_DB: ${POSTGRES_DB:-mastercrm_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mastercrm} -d ${POSTGRES_DB:-mastercrm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: mastercrm_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-mastercrm}:${POSTGRES_PASSWORD:-mastercrm_pass}@db:5432/${POSTGRES_DB:-mastercrm_db}

volumes:
  postgres_data:
